<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS Gen AI Assistant</title>
    <style>
        /* Modern Dark Theme Design (CSS) */
        :root {
            --bg-color: #1e1e2e;
            --container-bg: #252538;
            --text-color: #cdd6f4;
            --accent-color: #ff9900; /* AWS Orange */
            --accent-hover: #e08800;
            --user-bubble: #313244;
            --ai-bubble: #45475a;
            --border-color: #45475a;
            --error-color: #f38ba8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 800px;
            height: 85vh;
            background-color: var(--container-bg);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        /* Header Navigation Styles */
        .chat-header {
            background-color: #11111b;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .chat-header h1 {
            font-size: 1.5rem;
            color: #ffffff;
            font-weight: 600;
        }

        .chat-header h1 span {
            color: var(--accent-color);
        }

        .chat-subtitle {
            font-size: 0.85rem;
            color: #a6adc8;
        }

        /* Chat History Stream Window */
        .chat-window {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            scroll-behavior: smooth;
        }

        .message-row {
            display: flex;
            width: 100%;
        }

        .message-row.user-row {
            justify-content: flex-end;
        }

        .message-row.ai-row {
            justify-content: flex-start;
        }

        .bubble {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.5;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .user-row .bubble {
            background-color: var(--accent-color);
            color: #11111b;
            border-bottom-right-radius: 4px;
            font-weight: 500;
        }

        .ai-row .bubble {
            background-color: var(--ai-bubble);
            color: var(--text-color);
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border-color);
        }

        .system-status {
            align-self: center;
            font-size: 0.85rem;
            color: #a6adc8;
            font-style: italic;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 14px;
            border-radius: 20px;
        }

        .system-error {
            color: var(--error-color);
            background: rgba(243, 139, 168, 0.1);
            border: 1px solid var(--error-color);
        }

        /* Message Input & Action Bar */
        .chat-input-area {
            padding: 20px;
            background-color: #11111b;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .chat-input-area textarea {
            flex: 1;
            background-color: var(--user-bubble);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            color: var(--text-color);
            font-size: 0.95rem;
            resize: none;
            height: 48px;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .chat-input-area textarea:focus {
            border-color: var(--accent-color);
        }

        .chat-input-area button {
            background-color: var(--accent-color);
            color: #11111b;
            border: none;
            border-radius: 8px;
            padding: 0 24px;
            height: 48px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .chat-input-area button:hover {
            background-color: var(--accent-hover);
        }

        .chat-input-area button:active {
            transform: scale(0.98);
        }

        .chat-input-area button:disabled {
            background-color: #585b70;
            color: #a6adc8;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <!-- Application Header Layout -->
        <header class="chat-header">
            <h1>AWS Gen AI <span>Assistant</span></h1>
            <div class="chat-subtitle">Serverless Core Architecture powered by Amazon Bedrock Nova</div>
        </header>

        <!-- Dynamic Chat Bubble Output Feed -->
        <main class="chat-window" id="chatWindow">
            <div class="message-row ai-row">
                <div class="bubble">Hello! I am connected to Amazon Bedrock. Ask me anything to query our serverless backend!</div>
            </div>
        </main>

        <!-- Chat Form Controls Elements -->
        <footer class="chat-input-area">
            <textarea 
                id="userInput" 
                placeholder="Ask something (e.g., Explain AWS Lambda in simple words)..."
                maxlength="1000"
            ></textarea>
            <button id="sendBtn" onclick="askAI()">Send</button>
        </footer>
    </div>

    <!-- Application Controller Logic (JavaScript) -->
    <script>
        // CRITICAL CONFIGURATION: Replace this string with your deployed API Gateway Endpoint URL
        const API_URL = "https://2ax8l8uvql.execute-api.us-east-1.amazonaws.com/ask"; 

        const chatWindow = document.getElementById("chatWindow");
        const userInput = document.getElementById("userInput");
        const sendBtn = document.getElementById("sendBtn");

        // UI Event Listener for Keyboard Form Submission (Enter Key triggers send)
        userInput.addEventListener("keydown", function(event) {
            if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault(); // Stop default newline action
                askAI();
            }
        });

        /**
         * Orchestrates the communication workflow between user frontend and AWS API Gateway
         */
        async function askAI() {
            const promptText = userInput.value.trim();
            
            // Abort processing if string is completely empty spaces
            if (!promptText) return;

            // Step A: Update UI states to locked down while awaiting transmission
            userInput.value = "";
            userInput.disabled = true;
            sendBtn.disabled = true;

            // Step B: Inject User Message Bubble visually into window stream
            appendMessage(promptText, "user");
            
            // Step C: Inject a visual "Thinking..." component for status updates
            const loaderId = appendStatus("AI is thinking...");

            try {
                // Step D: Transmit payload down to live serverless endpoint via async fetch
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        question: promptText
                    })
                });

                // Drop the operational status loader once payload arrives back
                removeElement(loaderId);

                if (!response.ok) {
                    throw new Error(`Server returned HTTP Error Status: ${response.status}`);
                }

                const data = await response.json();

                // Step E: Route results back up to view panel
                if (data.success && data.answer) {
                    appendMessage(data.answer, "ai");
                } else if (data.error) {
                    appendStatus(`Execution Error: ${data.error}`, true);
                } else {
                    appendStatus("Unknown backend interface exception encountered.", true);
                }

            } catch (error) {
                console.error("Networking Transmission Failure:", error);
                removeElement(loaderId);
                appendStatus(`Connection Failure: Could not reach the API. Verify your API Gateway URL and CORS settings.`, true);
            } finally {
                // Step F: Reinstate UI elements for user interactive mode
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();
                scrollToBottom();
            }
        }

        /**
         * Renders an individual text conversational message dialog bubble
         */
        function appendMessage(text, sender) {
            const row = document.createElement("div");
            row.classList.add("message-row", `${sender}-row`);

            const bubble = document.createElement("div");
            bubble.classList.add("bubble");
	    bubble.textContent = text;
	    row.appendChild(bubble);
	    chatWindow.appendChild(row);
	    scrollToBottom();
        }
/**
* Renders system runtime notifications or error warnings directly inside log stream
*/
function appendStatus(message, isError = false) {
	const uniqueId = "status-" + Date.now();
	const statusDiv = document.createElement("div");
	statusDiv.id = uniqueId;
	statusDiv.classList.add("system-status");
	if (isError) {
		statusDiv.classList.add("system-error");
	}
	statusDiv.textContent = message;
	chatWindow.appendChild(statusDiv);
	scrollToBottom();
	return uniqueId;
}
/**
* Housekeeping function to purge processing node placeholders from application viewport
*/
function removeElement(id) {
	const element = document.getElementById(id);
	if (element) element.remove();
}
/**
* Controls scrolling context within container layout box
*/
function scrollToBottom() {
	chatWindow.scrollTop = chatWindow.scrollHeight;
}
</script>
